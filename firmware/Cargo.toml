[package]
name = "firmware"
version = "0.2.1"
edition = "2024"

[dependencies]
ed25519-dalek = "3.0.0"
hex = "0.4.3"
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# panic stays "unwind" so Drop guards (servo signal off) run on panic.
