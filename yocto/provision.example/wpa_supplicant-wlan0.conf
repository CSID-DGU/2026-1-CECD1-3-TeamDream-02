ctrl_interface=/run/wpa_supplicant
update_config=0
country=KR

# Higher priority wins. Keep the owner's recovery hotspot as a fallback (never remove it).
network={
    ssid="YOUR-AP-SSID"
    psk="YOUR-AP-PASSWORD"
    priority=100
}

network={
    ssid="YOUR-HOTSPOT-SSID"
    psk="YOUR-HOTSPOT-PASSWORD"
    priority=50
}
