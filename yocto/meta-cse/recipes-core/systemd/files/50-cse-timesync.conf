[Time]
# No RTC: get the time as soon as Wi-Fi is up (retry every 10 s instead of 30) and from servers that do not
# depend on what the router hands out. The clock is saved to disk every minute, so after a power cut it restarts
# from the last saved time, not from the image build date.
NTP=time.google.com time.cloudflare.com
FallbackNTP=kr.pool.ntp.org pool.ntp.org
ConnectionRetrySec=10
SaveIntervalSec=60
