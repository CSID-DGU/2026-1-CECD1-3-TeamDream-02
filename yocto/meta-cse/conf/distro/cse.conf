# CSE capstone distro: everything that makes the image reproducible lives here, not in build/conf.
require conf/distro/poky.conf

DISTRO = "cse"
DISTRO_NAME = "CSE capstone (Pi Zero W)"
DISTRO_VERSION = "0.1"

INIT_MANAGER = "systemd"

# Headless sensor board: no audio, Bluetooth, modem, NFC, NFS, X11.
DISTRO_FEATURES:remove = "alsa bluetooth 3g nfc nfs x11 pulseaudio"
MACHINE_FEATURES:remove = "alsa bluetooth keyboard screen touchscreen apm"
# meta-raspberrypi installs all ~1770 kernel modules; the image lists the ones it needs (cse-image.inc)
MACHINE_EXTRA_RRECOMMENDS:remove = "kernel-modules bluez-firmware-rpidistro-bcm43430a1-hcd"
BAD_RECOMMENDATIONS += "systemd-serialgetty"

# Same hardware setup as the Raspbian boards (handoff programming_guide.md)
ENABLE_I2C = "1"
KERNEL_MODULE_AUTOLOAD:append:rpi = " i2c-dev pwm-bcm2835"
# GPIO12/13 hardware PWM for the two servos; the stock overlay list does not ship this one
RPI_KERNEL_DEVICETREE_OVERLAYS:append = " overlays/pwm-2chan.dtbo"
RPI_EXTRA_CONFIG = "dtoverlay=pwm-2chan,pin=12,func=4,pin2=13,func2=4"
# serial0 belongs to the ZD100 (9600 8N1): UART on, no kernel console, no getty
ENABLE_UART = "1"
CMDLINE_SERIAL = ""
SERIAL_CONSOLES = ""

# BCM43430 Wi-Fi firmware (linux-firmware-rpidistro); without it there is no Wi-Fi.
LICENSE_FLAGS_ACCEPTED += "synaptics-killswitch"

# /var/log on the SD card, not tmpfs: the journal must survive power cuts (size cap in systemd_%.bbappend)
FILESYSTEM_PERMS_TABLES:remove = "files/fs-perms-volatile-log.txt"

PACKAGE_CLASSES = "package_ipk"
IMAGE_FSTYPES = "wic.bz2 wic.bmap"

# Where authorized_keys and wpa_supplicant-wlan0.conf come from (never committed, see provision.example/)
CSE_PROVISION_DIR ?= "${TOPDIR}/../provision"
