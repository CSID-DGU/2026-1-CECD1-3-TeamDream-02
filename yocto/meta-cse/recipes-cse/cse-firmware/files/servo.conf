# Servo board settings, read when servo-logger starts (sudo systemctl restart servo-logger).
# A line that cannot be read keeps the logger running on the defaults below, but switches pressing off.

# seconds between "sample" records (the radon board samples every 60 s too)
#sample_s=60

# Indicator lights through the CdS cells: a cell reads LOW when its light is on.
# Normally exactly one light is on: when the two cell voltages differ by more than led_diff_v, the lower one is
# the lit light and the other one is off. Only when they are closer than that (both on, or both off) each cell is
# judged by itself: on below led_on_below_v, off above led_off_above_v, in between the last state stands.
# Check the real voltages on site (ldr1_v / ldr2_v in the records).
#led_diff_v=0.5
#led_on_below_v=2.0
#led_off_above_v=2.4

# A press moves one servo from rest to press, holds hold_ms there and moves back to rest (20 us every 60 ms).
# Signal range is fixed to 1300..1700 us. Which way and how far to press is found on site: sudo servo-press 1 1540
#sv1_rest_us=1500
#sv1_press_us=1600
#sv2_rest_us=1500
#sv2_press_us=1600
#hold_ms=500
