# Servo board settings, read when servo-logger starts (sudo systemctl restart servo-logger).
# A line that cannot be read keeps the logger running on the defaults below, but switches pressing off.

# seconds between "sample" records (the radon board samples every 60 s too)
#sample_s=60

# Indicator lights through the CdS cells: a cell reads LOW when its light is on.
# on below led_on_below_v, off above led_off_above_v, in between the last state stands.
# Check the real voltages on site (ldr1_v / ldr2_v in the records) and put the thresholds between them.
#led_on_below_v=2.0
#led_off_above_v=2.4

# A press moves one servo from rest to press and back (20 us every 60 ms), holds hold_ms at the press position.
# Signal range is fixed to 1300..1700 us. Which way and how far to press is found on site: sudo servo-press 1 1540
#sv1_rest_us=1500
#sv1_press_us=1600
#sv2_rest_us=1500
#sv2_press_us=1600
#hold_ms=500
